<!DOCTYPE html>
<html lang="en">
<head>

  <title>{{ title or "MML Food Tracking" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-kicker">MML</div>
        <h1>Food Tracking</h1>
      </div>
      <nav class="nav">

      {% block content %}{% endblock %}
    </main>
