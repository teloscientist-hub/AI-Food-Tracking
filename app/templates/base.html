<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "MML Food Tracking" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <div class="page-shell">
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    document.addEventListener("keydown", (event) => {
      if (
        event.key !== "Enter" ||
        event.defaultPrevented ||
        event.isComposing ||
        event.ctrlKey ||
        event.metaKey ||
        event.altKey
      ) {
        return;
      }

      const target = event.target;
      if (!(target instanceof HTMLElement)) {
        return;
      }

      const tagName = target.tagName.toLowerCase();
      if (
        tagName === "textarea" ||
        tagName === "select" ||
        target.isContentEditable
      ) {
        return;
      }

      if (tagName === "button" && target.getAttribute("type") === "submit") {
        return;
      }

      const form = target.closest("form");
      if (!form) {
        return;
      }

      const primaryAction = form.querySelector('button.button.primary[type="submit"]:not([disabled])');
      if (!(primaryAction instanceof HTMLButtonElement)) {
        return;
      }

      event.preventDefault();
      primaryAction.click();
    });
  </script>
</body>
</html>
